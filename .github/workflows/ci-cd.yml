name: CI-CD

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/agence-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/agence-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compile backend
        run: mvn -B -f backend/pom.xml -DskipTests compile

      - name: Test backend
        run: mvn -B -f backend/pom.xml test

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm run test --if-present -- --watch=false
        working-directory: frontend

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B -f backend/pom.xml sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN

  trivy-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  docker-build-push:
    needs: [build-and-test, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha
            type=raw,value=dev-latest,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=staging-latest,enable=${{ github.ref_name == 'staging' }}
            type=raw,value=prod-latest,enable=${{ github.ref_name == 'main' }}

      - name: Extract metadata frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha
            type=raw,value=dev-latest,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=staging-latest,enable=${{ github.ref_name == 'staging' }}
            type=raw,value=prod-latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.example.com/api/v1
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Trivy image scan backend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy image scan frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  deploy-dev:
    if: github.ref_name == 'develop'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
      - name: Deploy dev
        run: |
          helm upgrade --install agence-platform ./devops/helm/agence-platform \
            --namespace agence-dev --create-namespace \
            -f ./devops/helm/agence-platform/values.yaml \
            -f ./devops/helm/agence-platform/values-dev.yaml \
            --set backend.image.repository=${{ env.IMAGE_BACKEND }} \
            --set frontend.image.repository=${{ env.IMAGE_FRONTEND }} \
            --set backend.image.tag=dev-latest \
            --set frontend.image.tag=dev-latest \
            --wait --timeout 10m

  deploy-staging:
    if: github.ref_name == 'staging'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: Deploy staging
        run: |
          helm upgrade --install agence-platform ./devops/helm/agence-platform \
            --namespace agence-staging --create-namespace \
            -f ./devops/helm/agence-platform/values.yaml \
            -f ./devops/helm/agence-platform/values-staging.yaml \
            --set backend.image.repository=${{ env.IMAGE_BACKEND }} \
            --set frontend.image.repository=${{ env.IMAGE_FRONTEND }} \
            --set backend.image.tag=staging-latest \
            --set frontend.image.tag=staging-latest \
            --wait --timeout 10m

  deploy-prod:
    if: github.ref_name == 'main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > $HOME/.kube/config
      - name: Deploy production
        run: |
          helm upgrade --install agence-platform ./devops/helm/agence-platform \
            --namespace agence-prod --create-namespace \
            -f ./devops/helm/agence-platform/values.yaml \
            -f ./devops/helm/agence-platform/values-prod.yaml \
            --set backend.image.repository=${{ env.IMAGE_BACKEND }} \
            --set frontend.image.repository=${{ env.IMAGE_FRONTEND }} \
            --set backend.image.tag=prod-latest \
            --set frontend.image.tag=prod-latest \
            --wait --timeout 10m
