name: CI-CD

on:
  push:
    branches:
      - develop
      - staging
      - main
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/agence-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/agence-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Fix: cache-dependency-path pointait vers un fichier introuvable
      # ("Some specified paths were not resolved, unable to cache dependencies").
      # On utilise un pattern glob plus tolérant au lieu d'un chemin unique strict.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Garde-fou: échoue tôt et avec un message clair si le lockfile n'est
      # pas committé, plutôt que de laisser l'action de cache échouer de façon cryptique.
      - name: Verify frontend lockfile exists
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "::error::frontend/package-lock.json est introuvable dans le repo."
            echo "::error::Générez-le avec 'npm install' dans frontend/ puis committez-le (vérifiez aussi .gitignore)."
            exit 1
          fi

      - name: Compile backend
        run: mvn -B -f backend/pom.xml -DskipTests compile

      - name: Test backend
        run: mvn -B -f backend/pom.xml test

      - name: Install frontend deps
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm run test --if-present -- --watch=false
        working-directory: frontend

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            mvn -B -f backend/pom.xml sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
          else
            echo "SONAR_TOKEN/SONAR_HOST_URL non définis, analyse Sonar ignorée."
          fi


  docker-build-push:
    needs: [build-and-test, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha
            type=raw,value=dev-latest,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=staging-latest,enable=${{ github.ref_name == 'staging' }}
            type=raw,value=prod-latest,enable=${{ github.ref_name == 'main' }}

      - name: Extract metadata frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha
            type=raw,value=dev-latest,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=staging-latest,enable=${{ github.ref_name == 'staging' }}
            type=raw,value=prod-latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.example.com/api/v1
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Trivy image scan backend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy image scan frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  deploy-dev:
    if: github.ref_name == 'develop'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > "$HOME/.kube/config"
      # Fix sécurité: les secrets passés via --set apparaissent en clair dans les
      # logs Actions (commande Helm affichée). On les injecte via un fichier de
      # values temporaire non loggé, supprimé ensuite.
      - name: Deploy dev
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_DEV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
        run: |
          SECRETS_FILE=$(mktemp)
          cat > "$SECRETS_FILE" <<EOF
          postgres:
            password: "${POSTGRES_PASSWORD}"
          backend:
            jwtSecret: "${JWT_SECRET}"
          EOF
          helm upgrade --install agence ./devops/helm/agence \
            --namespace agence-dev --create-namespace \
            -f ./devops/helm/agence/values-dev.yaml \
            -f "$SECRETS_FILE" \
            --set backend.image.repository=${{ env.IMAGE_BACKEND }} \
            --set frontend.image.repository=${{ env.IMAGE_FRONTEND }} \
            --set backend.image.tag=dev-latest \
            --set frontend.image.tag=dev-latest \
            --set backend.image.pullPolicy=Always \
            --set frontend.image.pullPolicy=Always \
            --wait --timeout 10m
          rm -f "$SECRETS_FILE"

  deploy-staging:
    if: github.ref_name == 'staging'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
      - name: Deploy staging
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_STAGING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_STAGING }}
        run: |
          SECRETS_FILE=$(mktemp)
          cat > "$SECRETS_FILE" <<EOF
          postgres:
            password: "${POSTGRES_PASSWORD}"
          backend:
            jwtSecret: "${JWT_SECRET}"
          EOF
          helm upgrade --install agence ./devops/helm/agence \
            --namespace agence-staging --create-namespace \
            -f ./devops/helm/agence/values-staging.yaml \
            -f "$SECRETS_FILE" \
            --set backend.image.repository=${{ env.IMAGE_BACKEND }} \
            --set frontend.image.repository=${{ env.IMAGE_FRONTEND }} \
            --set backend.image.tag=staging-latest \
            --set frontend.image.tag=staging-latest \
            --set backend.image.pullPolicy=Always \
            --set frontend.image.pullPolicy=Always \
            --wait --timeout 10m
          rm -f "$SECRETS_FILE"

  deploy-prod:
    if: github.ref_name == 'main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"
      - name: Deploy production
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
        run: |
          SECRETS_FILE=$(mktemp)
          cat > "$SECRETS_FILE" <<EOF
          postgres:
            password: "${POSTGRES_PASSWORD}"
          backend:
            jwtSecret: "${JWT_SECRET}"
          EOF
          helm upgrade --install agence ./devops/helm/agence \
            --namespace agence-prod --create-namespace \
            -f ./devops/helm/agence/values-prod.yaml \
            -f "$SECRETS_FILE" \
            --set backend.image.repository=${{ env.IMAGE_BACKEND }} \
            --set frontend.image.repository=${{ env.IMAGE_FRONTEND }} \
            --set backend.image.tag=prod-latest \
            --set frontend.image.tag=prod-latest \
            --set backend.image.pullPolicy=Always \
            --set frontend.image.pullPolicy=Always \
            --wait --timeout 10m
          rm -f "$SECRETS_FILE"
