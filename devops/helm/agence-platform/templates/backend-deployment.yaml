apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agence-platform.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "agence-platform.fullname" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "agence-platform.fullname" . }}
        component: backend
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "agence-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "agence-platform.fullname" . }}-secrets
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: 8080
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
