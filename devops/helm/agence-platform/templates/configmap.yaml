apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agence-platform.fullname" . }}-config
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.SPRING_PROFILES_ACTIVE | quote }}
  SERVER_PORT: {{ .Values.config.SERVER_PORT | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.CORS_ALLOWED_ORIGINS | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.config.SPRING_DATASOURCE_URL | quote }}
  VITE_API_BASE_URL: {{ .Values.config.VITE_API_BASE_URL | quote }}
