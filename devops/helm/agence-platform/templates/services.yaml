apiVersion: v1
kind: Service
metadata:
  name: {{ include "agence-platform.fullname" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: {{ include "agence-platform.fullname" . }}
    component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agence-platform.fullname" . }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    app: {{ include "agence-platform.fullname" . }}
    component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
