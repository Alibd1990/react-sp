# Valeurs dev issues de .env.dev (non sensibles en local). A ecraser en staging/prod.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: agence
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: agence-location
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: agence_pwd
  JWT_SECRET: dev_secret_key_32_chars_minimum_!!!!
  KUBECONFIG_DEV: replace-with-base64-kubeconfig
