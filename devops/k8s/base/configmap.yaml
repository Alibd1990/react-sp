apiVersion: v1
kind: ConfigMap
metadata:
  name: agence-config
  labels:
    app: agence
    component: config
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://app-dev.example.com"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/agence_location"
  VITE_API_BASE_URL: "https://api-dev.example.com/api/v1"
