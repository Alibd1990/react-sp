# Valeurs dev issues de .env.dev (non sensibles en local). A ecraser en staging/prod
# via `kubectl create secret` ou un values Helm --set-file dedie, ne jamais committer
# de vrais secrets de prod dans ce fichier.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: agence
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: agence-location
type: Opaque
stringData:
  POSTGRES_PASSWORD: agence_pwd
