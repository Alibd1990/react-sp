apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: agence-local
nodes:
  - role: control-plane
    extraPortMappings:
      # 80/443 sont reserves par Windows (http.sys) -> on utilise 8090/8443 sur l'hote
      - containerPort: 80
        hostPort: 8090
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
