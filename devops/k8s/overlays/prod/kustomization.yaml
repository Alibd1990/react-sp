apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agence-prod
resources:
  - ../../base
patchesStrategicMerge:
  - patch-configmap.yaml
  - patch-ingress.yaml
  - patch-replicas.yaml
  - patch-hpa.yaml
images:
  - name: ghcr.io/your-org/agence-backend
    newTag: prod-latest
  - name: ghcr.io/your-org/agence-frontend
    newTag: prod-latest
