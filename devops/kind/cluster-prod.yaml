kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agence-prod
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 7080
        protocol: TCP
      - containerPort: 443
        hostPort: 7443
        protocol: TCP
      - containerPort: 8080
        hostPort: 8082
        protocol: TCP
      - containerPort: 8081
        hostPort: 8083
        protocol: TCP
      - containerPort: 5432
        hostPort: 5434
        protocol: TCP
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6445
