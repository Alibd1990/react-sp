kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agence-staging
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      - containerPort: 8080
        hostPort: 9080
        protocol: TCP
      - containerPort: 8081
        hostPort: 9081
        protocol: TCP
      - containerPort: 5432
        hostPort: 5433
        protocol: TCP
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6444
