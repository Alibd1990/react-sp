apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agence-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: agence-http
      rules:
        - alert: BackendHigh5xxRate
          expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Taux d'erreurs 5xx > 5%"
        - alert: BackendHighLatencyP95
          expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Latence p95 backend > 1s"
